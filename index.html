<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prajita Tandukar | IT Portfolio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;700;800&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #181824;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f5;
    --muted: #888899;
    --accent: #7c6fff;
    --accent2: #5dcaa5;
    --accent3: #f09595;
    --tag-bg: rgba(124,111,255,0.12);
    --tag-text: #a89cff;
  }
  body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  .mono { font-family: 'DM Mono', monospace; }
  nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 2.5rem;
    border-bottom: 0.5px solid var(--border);
    position: sticky; top: 0;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(12px); z-index: 100;
  }
  .nav-logo { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 2rem; }
  .nav-links a { font-size: 0.8rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--text); }
  .hero { padding: 5rem 2.5rem 4rem; max-width: 900px; margin: 0 auto; }
  .hero-top { display: flex; align-items: flex-start; gap: 2.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
  .hero-photo {
    width: 120px; height: 120px; border-radius: 50%;
    object-fit: cover; object-position: center top;
    border: 2px solid var(--accent);
    flex-shrink: 0;
  }
  .hero-text { flex: 1; min-width: 220px; }
  .hero-eyebrow { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--accent2); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
  .hero-eyebrow::before { content: ''; display: inline-block; width: 24px; height: 1px; background: var(--accent2); }
  .hero h1 { font-size: clamp(2.4rem, 7vw, 4.5rem); font-weight: 800; line-height: 1.0; letter-spacing: -0.03em; margin-bottom: 0.75rem; }
  .hero h1 .line2 { color: var(--accent); display: block; }
  .hero-desc { font-size: 0.9rem; color: var(--muted); line-height: 1.75; max-width: 520px; margin-bottom: 1.75rem; }
  .hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.65rem 1.4rem; border-radius: 6px; font-family: 'DM Mono', monospace; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.05em; text-decoration: none; cursor: pointer; border: none; transition: all 0.2s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #9688ff; transform: translateY(-1px); }
  .btn-outline { background: transparent; border: 0.5px solid var(--border2); color: var(--muted); }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
  .hero-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 0.5px solid var(--border); border-radius: 12px; overflow: hidden; margin-top: 2.5rem; }
  .hero-stat { background: var(--surface); padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 0.3rem; }
  .hero-stat .num { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em; }
  .hero-stat .num .accent { color: var(--accent); }
  .hero-stat .label { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  section { max-width: 900px; margin: 0 auto; padding: 4rem 2.5rem; border-top: 0.5px solid var(--border); }
  .section-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--accent2); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem; }
  .section-label::before { content: '//'; color: var(--accent); font-weight: 700; }
  .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 2rem; }
  .skill-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 1.25rem; transition: border-color 0.2s, transform 0.2s; }
  .skill-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .skill-card-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--tag-bg); display: flex; align-items: center; justify-content: center; margin-bottom: 0.75rem; color: var(--accent); font-size: 1rem; }
  .skill-card h3 { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.5rem; }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
  .tag { font-family: 'DM Mono', monospace; font-size: 0.6rem; padding: 0.2rem 0.5rem; border-radius: 4px; background: var(--tag-bg); color: var(--tag-text); letter-spacing: 0.05em; }
  .tag.green { background: rgba(93,202,165,0.12); color: #5dcaa5; }
  .tag.coral { background: rgba(240,149,149,0.12); color: #f09595; }
  .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-top: 2rem; }
  .project-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; transition: border-color 0.2s, transform 0.2s; position: relative; overflow: hidden; }
  .project-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent); opacity: 0; transition: opacity 0.2s; }
  .project-card:hover { border-color: var(--border2); transform: translateY(-3px); }
  .project-card:hover::before, .project-card.highlight::before { opacity: 1; }
  .project-num { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--muted); letter-spacing: 0.1em; }
  .project-card h3 { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; }
  .project-card p { font-size: 0.82rem; color: var(--muted); line-height: 1.65; flex: 1; }
  .project-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 0.5rem; border-top: 0.5px solid var(--border); }
  .project-link { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--accent); text-decoration: none; letter-spacing: 0.05em; display: flex; align-items: center; gap: 0.3rem; transition: gap 0.2s; }
  .project-link:hover { gap: 0.5rem; }
  .exp-list { margin-top: 2rem; display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: 12px; overflow: hidden; border: 0.5px solid var(--border); }
  .exp-item { background: var(--surface); padding: 1.5rem; display: grid; grid-template-columns: 1fr auto; gap: 0.25rem 1rem; transition: background 0.2s; }
  .exp-item:hover { background: var(--surface2); }
  .exp-role { font-size: 0.95rem; font-weight: 700; letter-spacing: -0.01em; }
  .exp-company { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--accent); letter-spacing: 0.05em; }
  .exp-date { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); text-align: right; grid-row: 1; grid-column: 2; }
  .exp-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.6; grid-column: 1 / -1; margin-top: 0.5rem; }
  .exp-badges { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.5rem; }
  .leadership-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-top: 1rem; display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; }
  .leadership-card h3 { font-size: 0.95rem; font-weight: 700; }
  .leadership-card .org { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--accent2); letter-spacing: 0.05em; }
  .leadership-card .date { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); text-align: right; }
  .leadership-stats { grid-column: 1 / -1; display: flex; gap: 2rem; margin-top: 1rem; padding-top: 1rem; border-top: 0.5px solid var(--border); flex-wrap: wrap; }
  .l-stat .num { font-size: 1.4rem; font-weight: 800; color: var(--accent2); }
  .l-stat .lbl { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-top: 2rem; }
  .contact-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 1.25rem; text-decoration: none; color: var(--text); display: flex; align-items: center; gap: 0.75rem; transition: border-color 0.2s, transform 0.2s; }
  .contact-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .contact-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--tag-bg); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 1rem; flex-shrink: 0; }
  .contact-label { font-size: 0.7rem; color: var(--muted); font-family: 'DM Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; display: block; margin-bottom: 0.2rem; }
  .contact-val { font-size: 0.8rem; font-weight: 500; }
  .edu-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-top: 2rem; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; }
  .edu-degree { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.25rem; }
  .edu-school { font-family: 'DM Mono', monospace; font-size: 0.72rem; color: var(--accent); letter-spacing: 0.05em; }
  .edu-meta { font-size: 0.78rem; color: var(--muted); margin-top: 0.5rem; }
  .gpa-badge { background: rgba(93,202,165,0.15); color: var(--accent2); font-family: 'DM Mono', monospace; font-size: 0.72rem; padding: 0.4rem 0.9rem; border-radius: 6px; font-weight: 500; white-space: nowrap; }
  footer { max-width: 900px; margin: 0 auto; padding: 2rem 2.5rem; border-top: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
  footer p { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--muted); letter-spacing: 0.08em; }
  footer a { color: var(--accent); text-decoration: none; }

  @media (max-width: 600px) {
    nav { padding: 1rem 1.25rem; }
    .nav-links { gap: 1rem; }
    .nav-links a { font-size: 0.7rem; }
    .hero { padding: 2.5rem 1.25rem 2rem; }
    .hero-top { flex-direction: column; align-items: center; text-align: center; gap: 1.25rem; }
    .hero-photo { width: 96px; height: 96px; }
    .hero-eyebrow { justify-content: center; }
    .hero h1 { font-size: 2.2rem; }
    .hero-desc { font-size: 0.85rem; }
    .hero-actions { justify-content: center; }
    .hero-grid { grid-template-columns: repeat(3, 1fr); }
    .hero-stat { padding: 1rem 0.75rem; }
    .hero-stat .num { font-size: 1.3rem; }
    section { padding: 2.5rem 1.25rem; }
    .skills-grid { grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .projects-grid { grid-template-columns: 1fr; }
    .exp-item { grid-template-columns: 1fr; }
    .exp-date { grid-row: auto; grid-column: 1; text-align: left; }
    .leadership-card { grid-template-columns: 1fr; }
    .leadership-card .date { text-align: left; }
    .leadership-stats { gap: 1rem; }
    .contact-grid { grid-template-columns: 1fr; }
    .edu-card { flex-direction: column; }
    footer { flex-direction: column; text-align: center; gap: 0.25rem; padding: 1.5rem 1.25rem; }
  }
</style>
